<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Letter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* default cursor hide karke custom cursor dikhane ke liye */
      cursor: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a2e, #0f0f1b);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    .btn-container {
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
      cursor: none;
    }

    button:hover {
      background: #ff4b72;
      border-color: #ff4b72;
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 75, 114, 0.6);
    }

    /* Main Smooth Cursor Dot */
    #cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 18px;
      height: 18px;
      background: #ff4b72;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px #ff4b72, 0 0 25px #ff4b72;
      z-index: 9999;
      will-change: transform;
    }

    /* Trailing Effect Particle */
    .trail {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff85a1;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: fadeOut 0.6s linear forwards;
      z-index: 9998;
    }

    @keyframes fadeOut {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1);
      }
    }
  </style>
</head>
<body>

  <h1>Dear you, say yes?</h1>
  <div class="btn-container">
    <button>Yes</button>
    <button>No</button>
  </div>

  <!-- Custom Cursor Element -->
  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let currentX = mouseX;
    let currentY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      // Cursor trail particle generate karna
      const trail = document.createElement('div');
      trail.className = 'trail';
      trail.style.left = `${e.clientX}px`;
      trail.style.top = `${e.clientY}px`;
      document.body.appendChild(trail);

      setTimeout(() => {
        trail.remove();
      }, 600);
    });

    // Smooth physics/damping animation loop
    function animate() {
      // 0.15 smoothing factor hai (jitna kam utna smooth/heavy follow)
      currentX += (mouseX - currentX) * 0.15;
      currentY += (mouseY - currentY) * 0.15;

      dot.style.left = `${currentX}px`;
      dot.style.top = `${currentY}px`;

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
